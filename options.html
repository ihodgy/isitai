<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is It AI? — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f14;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px 40px;
      width: min(520px, calc(100vw - 32px));
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 32px;
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .field { margin-top: 22px; }
    input[type="password"], input[type="search"], select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 12px;
      color: #e5e5e5;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    select {
      appearance: auto;
      min-height: 42px;
    }
    .model-search { margin-bottom: 8px; }
    input:focus, select:focus {
      border-color: #60a5fa;
    }
    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 6px;
    }
    .hint a {
      color: #60a5fa;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 11px;
      background: #3b82f6;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    button.secondary {
      width: auto;
      margin: 0;
      padding: 6px 9px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.72);
      font-size: 12px;
    }
    button.secondary:hover { background: rgba(255,255,255,0.14); }
    .model-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }
    .model-status {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      line-height: 1.35;
    }
    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Is It AI?</h1>
    <p class="sub">Chrome extension settings</p>

    <label for="apiKey">OpenRouter API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your OpenRouter API key here…" autocomplete="off" />
    <p class="hint">
      Create a key in your <a href="https://openrouter.ai/settings/keys" target="_blank">OpenRouter settings</a>.
      Usage and pricing depend on the selected model.
    </p>

    <div class="field">
      <label for="visionModel">Vision model</label>
      <input
        type="search"
        class="model-search"
        id="modelSearch"
        placeholder="Search by model name or ID…"
        autocomplete="off"
        aria-label="Search vision models"
      />
      <select id="visionModel" disabled>
        <option value="openrouter/auto">OpenRouter Auto — recommended</option>
      </select>
      <div class="model-row">
        <span class="model-status" id="modelStatus">Loading structured-output vision models…</span>
        <button type="button" class="secondary" id="refreshModels">Refresh models</button>
      </div>
    </div>

    <button id="save">Save OpenRouter settings</button>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
