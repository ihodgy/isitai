<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f14;
      color: #e5e5e5;
      width: 240px;
      padding: 20px;
      text-align: center;
    }
    .logo { font-size: 36px; margin-bottom: 8px; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; margin-bottom: 16px; }
    a {
      display: block;
      padding: 9px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: #2563eb; }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .status.ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="logo">🤖</div>
  <h1>Is It AI?</h1>
  <p>Right-click any image on a page and choose <strong>"Check if AI-generated"</strong>.</p>
    <a id="optionsLink" href="#">OpenRouter Settings</a>
  <div class="status" id="keyStatus"></div>
  <script src="action_popup.js"></script>
</body>
</html>
